    <text x="28" y="184" fill="#fbbf24" font-size="11" font-weight="bold" class="font-sans">Autonomous Inbound Reply &amp; Cal.com Booking</text>
    <text x="28" y="202" fill="#94a3b8" font-size="10" class="font-sans">Reply: "Sounds good, what does your calendar look like next week?"</text>
    <rect x="28" y="212" width="424" height="28" rx="4" fill="#1e293b"/>
    <text x="38" y="230" fill="#38bdf8" font-size="10" font-weight="500" class="font-mono">Auto-Response: Book directly at https://cal.com/team/15min</text>
