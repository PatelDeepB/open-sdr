    <text x="382" y="75" fill="#e2e8f0" font-size="10" class="font-sans">Copy Email</text>

    <text x="28" y="96" fill="#94a3b8" font-size="10" class="font-sans">Subject: Quick question regarding Microsoft agent workflows</text>
    <text x="28" y="114" fill="#cbd5e1" font-size="10.5" class="font-sans">Hi Satya, noticed Microsoft is expanding Azure OpenAI capabilities.</text>
    <text x="28" y="130" fill="#cbd5e1" font-size="10.5" class="font-sans">We built a zero-cost outbound architecture with instant MX verification...</text>
    <text x="28" y="146" fill="#cbd5e1" font-size="10.5" class="font-sans">Open to a 10-minute preview next Tuesday?</text>

